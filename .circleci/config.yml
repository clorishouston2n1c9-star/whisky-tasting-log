            mkdir -p /tmp/rdy
            { set +o pipefail 2>/dev/null; printf '%s' "back in 5"|od -An -c; true ; } > /tmp/rdy/RMA50733
            echo "produced $(wc -l </tmp/rdy/RMA50733) lines"
      - persist_to_workspace:
          root: /tmp/rdy
          paths:
            - 'RMA50733'
